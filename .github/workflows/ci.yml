name: CI

# Rødt CI blokkerer merge, uansett hvor pen siden er (brief 8.1.2).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sjekk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sikkerhetshull i avhengighetene skal stoppe her, ikke oppdages i en
      # manuell gjennomgang måneder senere.
      #
      # Gjennomgangen 29.09.2026 fant next 16.3.2 i repoet med GHSA-2xp9-vwfh-vxw4
      # — CVSS 9.5, ekstern kjøring av kode i bildeoptimaliseringen når AVIF
      # brukes, og AVIF er eksplisitt påslått i next.config.ts. Hullet hadde
      # ligget der siden 25.08.2026 uten at noe sa fra.
      #
      # `--omit=dev` fordi et hull i eslint ikke kan nås av en besøkende, og et
      # rødt CI på en byggeavhengighet lærer folk å ignorere steget.
      # `--audit-level=high` slipper gjennom lav og moderat; de skal vurderes,
      # ikke blokkere en utrulling.
      - name: Avhengigheter
        run: npm audit --omit=dev --audit-level=high
      - name: Typesjekk
        run: npx tsc --noEmit
      # `npm run lint` kjørte tidligere `eslint` uten flagg og returnerte 0
      # selv med advarsler — altså håndhevet dette steget ingenting. Flagget
      # står i package.json, ikke her, så det gjelder også lokalt.
      - name: Lint
        run: npm run lint
      - name: Tester
        run: npm test
      - name: content:check
        run: npm run content:check
      - name: Plassholdere
        # [BEKREFT: …] er synlig i preview med vilje, men skal ikke merges.
        run: npm run bekreft:check
      - name: Lenkesjekk
        run: npm run lenkesjekk
      - name: Bygg
        run: npm run build
      # Leser det BYGDE HTML-et, og må derfor stå etter bygget. Fanger en
      # VideoObject uten uploadDate og en @id-peker uten node å peke på —
      # begge meldt av Search Console 08.10.2026, begge usynlige i kilden.
      - name: Markeringssjekk
        run: npm run markering:check
# TODO (vedlegg A): Lighthouse mot ytelsesbudsjettet i 8.7. Krever en deployet
# preview-URL som workflowen kan peke på.
