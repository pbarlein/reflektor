# Sier fra til Bing når en side har endret seg.
#
# HVORFOR DET ER VERDT NOE: ChatGPT-søk og Copilot henter fra Bings indeks,
# så raskere indeksering der er synlighet i AI-svar. Google deltar ikke i
# IndexNow — dette flytter ingenting der.
#
# KJØRER ETTER AT UTRULLINGEN ER LIVE, ikke under bygget. Å melde fra om en
# side før den er ute er verre enn ikke å melde fra: Bing henter den, ser den
# gamle versjonen, og kommer ikke tilbake med det første. `deployment_status`
# fra Vercel er det eneste signalet vi har som faktisk betyr «nå er den ute».
#
# STOPPER INGENTING. Jobben står utenfor CI. Blir den rød, er det fordi
# IndexNow svarte med feil — og da skal den være rød, slik at neste kjøring
# prøver de samme URL-ene om igjen. Siden er for lengst ute når dette kjører.
name: IndexNow

on:
  deployment_status:

permissions:
  actions: read

jobs:
  meld:
    # Vercel kaller miljøet «Production – reflektor-ny». Forhåndsvisninger
    # heter «Preview – …» og skal ikke meldes inn noe sted.
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment_status.environment, 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # TIDSPUNKTET FOR FORRIGE INNSENDING, HENTET FRA GITHUB.
      #
      # Her sto `actions/cache`, og den kan ikke lagre på et
      # `deployment_status`-event: «The event type deployment_status is not
      # supported because it's not tied to a branch or tag ref». Jobben så
      # vellykket ut, men ingenting ble lagret — og da ville alle URL-ene
      # gått inn på nytt ved hver eneste utrulling. Fanget i loggen fra
      # første kjøring 08.10.2026.
      #
      # Den forrige VELLYKKEDE kjøringen av denne arbeidsflyten er den samme
      # opplysningen, uten noe å lagre og uten noe som kan komme i utakt.
      # Finnes ingen, er det første gang, og da sendes alt.
      - name: Finn forrige vellykkede innsending
        id: forrige
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sist=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/indexnow.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty' || true)
          echo "Forrige vellykkede kjøring: ${sist:-ingen}"
          echo "sist=$sist" >> "$GITHUB_OUTPUT"

      # Ingen `npm ci`: skriptet importerer bare én fil fra src/lib, og den
      # har ingen avhengigheter. Jobben tar sekunder.
      - name: Meld endrede URL-er
        env:
          INDEXNOW_SIST: ${{ steps.forrige.outputs.sist }}
        run: node --experimental-strip-types scripts/indexnow.ts
